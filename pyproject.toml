[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meridian"
version = "2.0.0"
description = "Meridian AI Blog Platform — Python services"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
observability = [
    "langfuse>=3.0",
    "openinference-instrumentation-openai>=0.1",
    "openinference-instrumentation-openai-agents>=1.6.2",
]
post_agent = [
    "langgraph>=1.2.7",
    "langchain-core>=1.4.7",
    "openai>=1.0",
    "huggingface_hub>=0.23",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.1",
    "requests>=2.31",
    "google-genai>=2.10.0",
    "Pillow>=10.0",
    "croniter>=2.0",
    "meridian[observability]",
]
tts = [
    "flask>=3.1.3",
    "transformers>=4.35",
    "scipy>=1.15.3",
    "numpy>=1.24",
    "gunicorn>=21.0",
]
maintenance = [
    "autogen-agentchat>=0.7.5",
    "autogen-ext[openai]>=0.7.5",
    "openai>=1.0",
    "python-dotenv>=1.2.2",
    "requests>=2.31",
    "croniter>=2.0",
    "meridian[observability]",
]
rebranding = [
    "openai-agents>=0.17.6",
    "openai>=1.0",
    "python-dotenv>=1.2.2",
    "requests>=2.31",
    "meridian[observability]",
]
story_agent = [
    "openai>=1.0",
    "huggingface_hub>=0.23",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.1",
    "requests>=2.31",
    "google-genai>=2.10.0",
    "Pillow>=10.0",
    "croniter>=2.0",
    "langgraph>=1.2.7",
    "langchain-core>=1.4.7",
    "meridian[observability]",
]
news_agent = [
    "openai-agents>=0.17.6",
    "openai>=1.0",
    "feedparser>=6.0",
    "PyJWT>=2.8",
    "requests>=2.31",
    "python-dotenv>=1.2.2",
    "google-genai>=2.10.0",
    "meridian[observability]",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
all = ["meridian[post_agent,tts,maintenance,rebranding,story_agent,news_agent,test,observability]"]

[tool.hatch.build.targets.wheel]
packages = ["meridian_agents"]

[tool.pytest.ini_options]
testpaths = ["meridian_agents/tests"]

[tool.coverage.run]
source = ["meridian_agents"]
omit = ["meridian_agents/tests/*"]
