sonar.projectKey=${SONAR_PROJECT_KEY}
sonar.projectName=Meridian Blog
sonar.projectVersion=1.0

sonar.sources=.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/*.db,\
  **/uploads/**,\
  **/coverage/**,\
  **/.github/**,\
  **/meridian_agents/**,\
  **/public/icons/**,\
  **/scripts/**

sonar.javascript.file.suffixes=.js,.mjs,.cjs,.vue
sonar.typescript.file.suffixes=.ts,.tsx

sonar.sourceEncoding=UTF-8
