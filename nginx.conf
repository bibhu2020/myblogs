server {
    listen 7860;

    # Frontend SPA
    location / {
        root /app/frontend/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /app/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Media uploads → media-service:3003
    location /uploads/ {
        proxy_pass         http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        client_max_body_size 50m;
    }

    # API proxy → api-gateway:3000
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # Pre-rendered narration mp3s synthesize a whole article in one call. CPU-based
        # Kokoro synthesis on this host has been observed taking several minutes for a
        # long article — must stay >= tts-service's own gunicorn timeout, not the old
        # 10-30s per-chunk figure this was originally sized for.
        proxy_read_timeout 910s;
        client_max_body_size 10m;
    }
}
