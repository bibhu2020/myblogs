[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
loglevel=info

# Local TTS service — starts first so it's ready before the gateway receives requests
[program:tts]
command=/app/tts-service/start.sh
directory=/app/tts-service
environment=HF_HOME="/app/models"
autostart=true
autorestart=unexpected
exitcodes=0
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:auth]
command=node dist/main.js
directory=/app/auth-service
environment=NODE_ENV="production"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:blog]
command=node dist/main.js
directory=/app/blog-service
environment=NODE_ENV="production"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:media]
command=node dist/main.js
directory=/app/media-service
environment=NODE_ENV="production"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gateway]
command=node dist/main.js
directory=/app/api-gateway
environment=NODE_ENV="production"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:agent]
command=node schedule.js
directory=/app/agent
environment=NODE_ENV="production",CRON_SCHEDULE="0 3 * * *",MCP_URL="http://localhost:3000/api/mcp",SERVER_BASE="http://localhost:3000"
autostart=true
autorestart=true
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
