name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  build-check:
    name: Build all services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Build all services + frontend
        run: npm run build:all

  sonarqube-scan:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -e ".[all]" --quiet

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests with coverage
        continue-on-error: true
        run: npm run coverage:all

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: npm run sonar

      # Handed off to the sonarqube-gate job below (mirrors codeql/codeql-gate) so the
      # gate has its own named check instead of being a silent step inside this job —
      # only report-task.txt is needed there (it carries the ceTaskId the gate script
      # polls), not the full scan output.
      - name: Upload SonarQube scan report
        uses: actions/upload-artifact@v4
        with:
          name: sonar-report-task
          path: .scannerwork/report-task.txt
          retention-days: 1

  sonarqube-gate:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    needs: sonarqube-scan
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download SonarQube scan report
        uses: actions/download-artifact@v4
        with:
          name: sonar-report-task
          path: .scannerwork

      # Called directly rather than via `npm run sonar:gate` — that wrapper's only job is
      # loading .env for local dev; env vars are already supplied below in CI, and calling
      # the script directly keeps this job as lightweight as codeql-gate (no Node/npm setup).
      - name: SonarQube Quality Gate check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: sh scripts/sonar-quality-gate.sh

  codeql:
    name: CodeQL Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Installing deps (not building) helps CodeQL resolve TS/JS imports more
      # precisely. Not required for Python — CodeQL parses it directly.
      - name: Set up Node.js 20
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: npm ci
        if: matrix.language == 'javascript-typescript'
        run: npm ci --ignore-scripts

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  codeql-gate:
    name: CodeQL Security Gate
    runs-on: ubuntu-latest
    needs: codeql
    permissions:
      security-events: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enforce CodeQL severity gate (0 critical, <= 2 high)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run codeql:gate

  dependency-review:
    name: Dependency Review (SCA)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # SCA, not SAST: flags known-vulnerable or license-problematic *new*
      # dependencies introduced by this PR's diff to package.json/
      # package-lock.json/pyproject.toml, via the same GitHub Advisory
      # Database that powers Dependabot alerts (Security tab) — but scoped
      # to this PR instead of the whole repo, and gated inline instead of
      # informational-only. Complements, not replaces, Dependabot alerts,
      # which continuously cover the whole dependency tree (not just PR
      # diffs) and react to newly-published advisories with no PR needed.
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  dast:
    name: OWASP ZAP Baseline Scan (DAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # only for the upload-sarif step below

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: npm ci
        run: npm ci

      # Raw services via `npm start`, not the production Docker image — DAST
      # doesn't need the TTS/PyTorch/Kokoro build, and this boots in seconds
      # instead of minutes. Backgrounded so it survives into the next step;
      # GitHub-hosted Linux runners execute Docker-based actions (ZAP below)
      # with host networking, so localhost is reachable from both.
      - name: Start the app
        run: |
          npm start > /tmp/app.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 >/dev/null 2>&1 && curl -sf http://localhost:3000/api/posts >/dev/null 2>&1; then
              echo "App is up"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become ready in time"
          cat /tmp/app.log
          exit 1

      # Passive-only: spiders the running frontend and inspects responses
      # (headers, cookies, disclosed info) without sending attack payloads —
      # safe against the real seeded data in blog.db/auth.db/media.db.
      # fail_action and allow_issue_writing stay false — the action's own
      # built-in behavior would fail (or file issues for) *any* finding,
      # including Medium/Low header-hardening noise a dev-mode server
      # normally produces. The real gate is dast-gate below, which only
      # fails on High-risk findings (ZAP's own Risk scale, not a CVE/CVSS
      # score — see zap-quality-gate.sh) via the SARIF upload.
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:5173'
          fail_action: false
          allow_issue_writing: false
          artifact_name: 'zap-baseline-report'

      # ZAP's own risk scale tops out at High — there's no tier above it,
      # so "critical or high" here means High only. Medium/Low/Informational
      # (the header-hardening findings a dev-mode server normally produces)
      # stay out of the Security tab entirely; they're still visible in the
      # job log and the full HTML artifact above.
      #
      # report_json.json is action-baseline's own default JSON report path
      # (it writes this itself, unprompted) — don't override it via
      # cmd_options' -J flag, the action's own post-processing step expects
      # to find the report at exactly this filename and fails outright if
      # zap-baseline.py was told to write somewhere else instead.
      - name: Convert High-risk ZAP alerts to SARIF
        run: python3 scripts/zap-alerts-to-sarif.py report_json.json zap-high.sarif

      - name: Upload ZAP SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: zap-high.sarif
          category: zap-baseline

  dast-gate:
    name: DAST Security Gate
    runs-on: ubuntu-latest
    needs: dast
    permissions:
      security-events: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Enforce DAST severity gate (0 High-risk findings)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sh scripts/zap-quality-gate.sh
