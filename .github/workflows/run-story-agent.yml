name: Run Story Agent

on:
  schedule:
    # Alternate-day cadence anchored on Saturday: Sat, Mon, Wed, Fri at 04:00 UTC.
    - cron: '0 4 * * 6,1,3,5'
  workflow_dispatch:
    inputs:
      genre:
        description: 'Force a specific story genre (leave blank for random within the chosen age group)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - Panchatantra Tales
          - Popular Cartoon Adventure
          - Superhero Adventure
          - Indian Mythology
          - Quantum Adventure
          - Relativity & Spacetime
      age_group:
        description: 'Target age group (leave blank for random)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - '2-7'
          - '8-15'
          - '16+'

jobs:
  story-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -e ".[story_agent]" --quiet

      - name: Generate story
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST }}
          LANGFUSE_DEBUG: ${{ vars.LANGFUSE_DEBUG }}
          SERVER_BASE: ${{ vars.HF_SPACE_URL }}
          STORY_GENRE: ${{ inputs.genre }}
          STORY_AGE_GROUP: ${{ inputs.age_group }}
        run: python3 -m meridian_agents.story_agent
