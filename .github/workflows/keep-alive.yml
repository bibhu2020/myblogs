name: Keep HF Space Alive

on:
  schedule:
    - cron: '*/25 * * * *'   # every 25 minutes — HF sleeps after ~1h inactivity
  workflow_dispatch:          # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF Space
        run: |
          echo "Pinging HF Space at $(date -u)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5 \
            "https://mishrabp-myblogs.hf.space/")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Space is alive."
          else
            echo "Warning: unexpected status $STATUS — space may be waking up."
          fi
