name: Post Agent Resume (Approve / Reject)

# Triggered by the blog-service when admin approves or rejects a pending post.
# This is the "resume" half of the post-agent's human-in-the-loop flow:
#
#   Generate phase  → GH Actions run ends (agent sleeps)
#   Admin acts      → blog-service fires repository_dispatch post-decision
#   Resume phase    → this workflow wakes up and cleans up resources
#
# On approve: records the decision in the pending registry (no media changes).
# On reject:  removes orphaned media files immediately via cleanup_media.py,
#             then records the decision in the pending registry.

on:
  repository_dispatch:
    types: [post-decision]
  workflow_dispatch:
    inputs:
      action:
        description: 'Admin decision'
        required: true
        type: choice
        options: [approve, reject]
      post_id:
        description: 'Post ID'
        required: true

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # commit pending registry + media cleanup changes

    steps:
      - name: Resolve action and post_id
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "action=${{ github.event.client_payload.action }}" >> "$GITHUB_OUTPUT"
            echo "post_id=${{ github.event.client_payload.post_id }}" >> "$GITHUB_OUTPUT"
          else
            echo "action=${{ inputs.action }}" >> "$GITHUB_OUTPUT"
            echo "post_id=${{ inputs.post_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -e ".[post_agent]" --quiet

      - name: Remove orphaned media files (rejected posts only)
        if: steps.vars.outputs.action == 'reject'
        run: python3 scripts/cleanup_media.py

      - name: Update pending posts registry
        run: |
          python3 -m meridian_agents.post_agent registry-remove ${{ steps.vars.outputs.post_id }}

      - name: Commit registry and media changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add meridian_agents/post_agent/pending_posts.jsonl
          if [ "${{ steps.vars.outputs.action }}" = "reject" ]; then
            git add media-service/uploads/ media-service/media.db || true
          fi
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(posts): post #${{ steps.vars.outputs.post_id }} ${{ steps.vars.outputs.action }}d — registry + media updated [automated]"
            git push
          fi
