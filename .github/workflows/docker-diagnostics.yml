name: Docker Diagnostics

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Check HF Space secrets and runtime
    runs-on: ubuntu-latest
    steps:
      - name: List current HF Space secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "=== HF Space secrets (names only) ==="
          curl -s "https://huggingface.co/api/spaces/mishrabp/myblogs/secrets" \
            -H "Authorization: Bearer ${HF_TOKEN}" | python3 -c "
import sys, json
data = json.load(sys.stdin)
if isinstance(data, list):
    for s in data:
        print(' -', s.get('key', s))
else:
    print(data)
"
          echo ""
          echo "=== HF Space runtime ==="
          curl -s "https://huggingface.co/api/spaces/mishrabp/myblogs" \
            -H "Authorization: Bearer ${HF_TOKEN}" | python3 -c "
import sys, json
d = json.load(sys.stdin)
rt = d.get('runtime', {})
print('Stage:', rt.get('stage'))
print('SHA:  ', rt.get('sha','?')[:12])
print('Error:', rt.get('errorMessage','none'))
"

      - name: Force-delete DATABASE_URL and re-trigger factory reboot
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          echo "Deleting DATABASE_URL (raw response):"
          curl -v -X DELETE \
            "https://huggingface.co/api/spaces/mishrabp/myblogs/secrets/DATABASE_URL" \
            -H "Authorization: Bearer ${HF_TOKEN}" 2>&1 | tail -20
          echo ""
          echo "Triggering factory reboot..."
          curl -s -X POST \
            "https://huggingface.co/api/spaces/mishrabp/myblogs/restart?factory=true" \
            -H "Authorization: Bearer ${HF_TOKEN}"
          echo ""
          echo "Done."
