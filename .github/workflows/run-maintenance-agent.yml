name: Run Maintenance Agent

on:
  schedule:
    - cron: '0 0 1 * *'  # 1st of each month at 00:00 UTC
  workflow_dispatch:      # Manual trigger always runs immediately

jobs:
  maintenance-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write        # git push fix branches + merge PRs
      pull-requests: write   # create / merge / close PRs

    steps:
      - name: Configure git identity
        run: |
          git config --global user.email "maintenance-agent@meridian.internal"
          git config --global user.name "Meridian Maintenance Agent"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so branch creation works correctly
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -e ".[maintenance]" --quiet

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install all Node.js dependencies
        run: npm run install:all

      - name: Run maintenance agent
        env:
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SECRET_TOKEN_GITHUB: ${{ secrets.GITHUB_TOKEN }}
          SERVER_BASE: ${{ vars.HF_SPACE_URL }}
          GITHUB_REPO: ${{ github.repository }}
        run: python3 -m meridian_agents.maintenance_agent
