name: Run Rebranding Agent

on:
  schedule:
    - cron: '0 3 * * 1'   # Every Sunday 03:00 UTC — agent enforces first-Sunday-only guard
  workflow_dispatch:
    inputs:
      force_rebrand:
        description: 'Force rebrand regardless of schedule (bypass first-Sunday guard)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write           # Required: the agent commits and pushes the rebrand

jobs:
  rebranding-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Fast guard — skip all setup cost on non-first Sundays unless forced.
      # The agent also enforces this internally for standalone compatibility.
      - name: First-Sunday guard (skip non-first Sundays unless forced)
        id: guard
        run: |
          FORCE="${{ inputs.force_rebrand }}"
          if [ "$FORCE" = "true" ]; then
            echo "Manual trigger with force_rebrand=true — bypassing first-Sunday guard."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger without force flag — bypassing first-Sunday guard."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            day=$(printf '%d' "$(date -u +%d)")
            if [ "$day" -gt 7 ]; then
              echo "Not the first Sunday of the month (day $day). Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "First Sunday confirmed (day $day). Proceeding."
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          persist-credentials: true   # Allows the agent to git push

      - name: Configure git identity for agent commits
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "Claude Theme Bot"
          git config user.email "bm80177@gmail.com"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Node.js 20 (frontend build verification)
        uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci --silent

      - name: Install Python dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -e ".[rebranding]" --quiet

      - name: Run rebranding agent (theme + colours + copy)
        if: steps.guard.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST }}
          LANGFUSE_DEBUG: ${{ vars.LANGFUSE_DEBUG }}
          SERVER_BASE: ${{ vars.HF_SPACE_URL }}
          FORCE_REBRAND: ${{ inputs.force_rebrand || 'false' }}
          # GITHUB_WORKSPACE is set automatically by the runner
        run: python3 -m meridian_agents.rebranding_agent
