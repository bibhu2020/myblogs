name: Run Post Agent

on:
  schedule:
    # Alternate-day cadence anchored on Sunday: Sun, Tue, Thu, Sat at 03:00 UTC.
    - cron: '0 3 * * 0,2,4,6'
  workflow_dispatch:
    inputs:
      topic_mode:
        description: 'Force a specific category (or "random" for the weighted priority pick)'
        required: false
        default: 'random'
        type: choice
        options:
          - random
          - Technology
          - Education
          - Travel
          - History

jobs:
  post-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -e ".[post_agent]" --quiet

      - name: Resolve topic mode for manual dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.topic_mode != 'random'
        run: echo "TOPIC_MODE=${{ inputs.topic_mode }}" >> "$GITHUB_ENV"

      - name: Generate and publish blog post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          SERVER_BASE: ${{ vars.HF_SPACE_URL }}
          MCP_URL: ${{ vars.HF_SPACE_URL }}/api/mcp
          # TOPIC_MODE set by "Resolve topic mode" step above for manual dispatch;
          # unset on scheduled runs so the weighted priority pick applies.
        run: python3 -m meridian_agents.post_agent
