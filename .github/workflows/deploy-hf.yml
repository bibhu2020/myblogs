name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"

          # Create an orphan commit (no history) so HF never sees old commits
          # that contained binary files (db files, media uploads).
          git checkout --orphan hf-deploy

          # Remove db and upload files from the index before committing
          git rm --cached --ignore-unmatch \
            auth-service/auth.db \
            blog-service/blog.db \
            media-service/media.db
          git rm --cached -r --ignore-unmatch media-service/uploads/

          git commit -m "Deploy to HuggingFace Spaces"

          git remote add hf https://mishrabp:${HF_TOKEN}@huggingface.co/spaces/mishrabp/myblogs
          git push hf hf-deploy:main --force
