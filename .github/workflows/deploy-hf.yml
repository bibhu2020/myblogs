name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Hugging Face
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync secrets to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN_SECRET: ${{ secrets.GITHUB_TOKEN_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          GH_REPO: ${{ github.repository }}
        run: |
          SPACE="mishrabp/meridian"
          HF_API="https://huggingface.co/api/spaces/${SPACE}/secrets"

          push_secret() {
            local key="$1" val="$2"
            [ -z "$val" ] && return
            curl -s -X PUT "$HF_API" \
              -H "Authorization: Bearer ${HF_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"${key}\",\"value\":\"${val}\"}" | grep -v '"error"' || true
            echo "  pushed ${key}"
          }

          echo "Syncing secrets to HF Space ${SPACE}..."
          push_secret DATABASE_URL         "$DATABASE_URL"
          push_secret MCP_API_KEY          "$MCP_API_KEY"
          push_secret OPENAI_API_KEY       "$OPENAI_API_KEY"
          push_secret SECRET_TOKEN_GITHUB  "$GITHUB_TOKEN_SECRET"
          push_secret GEMINI_API_KEY       "$GEMINI_API_KEY"
          push_secret UNSPLASH_ACCESS_KEY  "$UNSPLASH_ACCESS_KEY"
          push_secret GITHUB_REPO          "$GH_REPO"
          push_secret HF_TOKEN             "$HF_TOKEN"
          echo "Done."

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"

          git checkout --orphan hf-deploy

          git rm --cached --ignore-unmatch \
            auth-service/auth.db \
            blog-service/blog.db \
            media-service/media.db
          git rm --cached -r --ignore-unmatch \
            media-service/uploads/ \
            agents/

          git commit -m "Deploy to HuggingFace Spaces"

          git remote add hf https://mishrabp:${HF_TOKEN}@huggingface.co/spaces/mishrabp/meridian
          git push hf hf-deploy:main --force
