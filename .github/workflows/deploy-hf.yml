name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"

          # Drop db and upload files from the deployment commit only.
          # This only affects the CI runner's checkout — GitHub repo is untouched.
          git rm --cached --ignore-unmatch \
            auth-service/auth.db \
            blog-service/blog.db \
            media-service/media.db
          git rm --cached -r --ignore-unmatch media-service/uploads/

          git commit -m "ci: deploy to HuggingFace (db and media files excluded)" --allow-empty

          git remote add hf https://mishrabp:${HF_TOKEN}@huggingface.co/spaces/mishrabp/myblogs
          git push hf HEAD:main --force
