name: Run News Agent

on:
  schedule:
    - cron: '0 6,18 * * *'   # Every day at 06:00 and 18:00 UTC
  workflow_dispatch:       # Manual trigger for testing

jobs:
  news-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -e ".[news_agent]" --quiet

      - name: Run news agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST }}
          LANGFUSE_DEBUG: ${{ vars.LANGFUSE_DEBUG }}
          SERVER_BASE: ${{ vars.HF_SPACE_URL }}
        run: python3 -m meridian_agents.news_agent
