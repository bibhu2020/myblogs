name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  build-check:
    name: Build all services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm ci + build — auth-service
        run: npm ci --prefix auth-service && npm --prefix auth-service run build

      - name: npm ci + build — blog-service
        run: npm ci --prefix blog-service && npm --prefix blog-service run build

      - name: npm ci + build — media-service
        run: npm ci --prefix media-service && npm --prefix media-service run build

      - name: npm ci + build — api-gateway
        run: npm ci --prefix api-gateway --ignore-scripts && npm --prefix api-gateway run build

      - name: npm ci + build — frontend
        run: npm ci --prefix frontend && npm --prefix frontend run build

  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests with coverage
        continue-on-error: true
        run: npm run coverage:all

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: npm run sonar

      - name: SonarQube Quality Gate check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: npm run sonar:gate
