version: 2

updates:
  # ── npm: single root package.json covering all services + the Vue frontend ─
  # Individual PRs (no groups) so the maintenance agent can parse the
  # "Bump X from A to B" title and decide whether to merge or close.

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 10

  # ── pip: Python agent packages ─────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
